name: Update content reoptimize

on:
  schedule:
    - cron: '52 6 * * *'  # daily, 06:52 UTC -- offset from the other two data-fetch workflows so they don't collide on the same commit
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install fetch script deps
        working-directory: fetch
        run: npm ci

      - name: Fetch content reoptimize data
        working-directory: fetch
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: node content-reoptimize.js

      - name: Commit updated data
        run: |
          git config user.name "gsc-reoptimizer-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --no-rebase --no-edit
          git add docs/data/content-reoptimize-*.json
          git diff --cached --quiet || git commit -m "Update content reoptimize data $(date -u +%Y-%m-%d)"
          git push
